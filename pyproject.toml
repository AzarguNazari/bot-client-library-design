[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chatbot-client"
dynamic = ["version"]
description = "Python client for the AiChatBot API: start chats and exchange messages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.hatch.version]
path = "src/chatbot_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_client"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
